name: Bug report
description: Something does not work as documented
labels:
  - bug
body:
  - type: textarea
    id: description
    attributes:
      label: What happened
      description: The tool or command you ran, what it returned, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: The tool call with its arguments, or the SQL, and any schema needed to reproduce it.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: postgres-mcp version
      placeholder: "0.4.0"
    validations:
      required: true
  - type: input
    id: postgres-version
    attributes:
      label: Postgres version
      placeholder: "16.4"
    validations:
      required: true
  - type: dropdown
    id: access-mode
    attributes:
      label: Access mode
      options:
        - unrestricted
        - restricted
    validations:
      required: true
  - type: dropdown
    id: transport
    attributes:
      label: Transport
      options:
        - stdio
        - sse
        - streamable-http
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Server output around the failure. Remove credentials and data you cannot share.
      render: text
