name: Feature request
description: Propose a new capability or a change in behaviour
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What you are trying to do and why the server does not support it today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: How it could work. Note that tool names, parameters and CLI flags follow upstream crystaldba/postgres-mcp and are not changed lightly.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
