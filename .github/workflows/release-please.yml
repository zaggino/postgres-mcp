name: Release Please
concurrency: release_please

on:
  push:
    branches:
      - main
  # Manual recovery for a release whose GitHub release/tag exists but whose npm
  # publish failed (a re-run sees the release as already created and skips it).
  # With `publish`, dispatch from main: release-please is skipped and main is
  # published, provided its package.json version is tagged and main matches that
  # tag outside .github/. Publishing main itself keeps npm provenance (which
  # records the run's ref and sha) truthful. Without `publish`, it runs
  # release-please as a push to main would.
  workflow_dispatch:
    inputs:
      publish:
        description: "Skip release-please and publish main to npm (its version must already be tagged)"
        type: boolean
        default: false

# Each job gets only what it needs. The token that can publish to npm (id-token) is held by the publish job
# alone, which installs nothing and runs no script from the repository or its dependencies.
permissions: {}

jobs:
  # On a manual dispatch with `publish` the release step is skipped and the job still succeeds, so `build` can
  # evaluate its own condition.
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # GH_TOKEN is a secret of the `main` environment, so the job has to name that environment to read it. The
    # environment is configured (repository settings) to accept main only: a run from another branch fails here,
    # and `build` and `publish` are skipped with it. The check of the ref further down is a backstop in case
    # that setting is ever loosened.
    environment: main
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
    steps:
      # Configuration: release-please-config.json and .release-please-manifest.json.
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        if: ${{ !inputs.publish && github.ref == 'refs/heads/main' }}
        with:
          token: ${{ secrets.GH_TOKEN }}

  # Checks, tests and packs the release. The tarball is handed to the publish job as an artifact.
  # Runs when release-please created a release, or on a manual dispatch with `publish`.
  build:
    needs: release-please
    if: ${{ inputs.publish || needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the guard below compares HEAD with the release tag
          persist-credentials: false

      # Runs on both paths. On a push, the run's commit is normally the tagged release commit, but it is not
      # when a newer push replaced the queued run of the release merge, or when a failed release is retried by
      # a later push. Building the tag instead would make the npm provenance (the run's ref and sha) false, so
      # such a run fails here; the release is then recovered by releasing a new version.
      - name: Verify HEAD is the tagged release
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Releases are published from main, not $GITHUB_REF"
            exit 1
          fi
          tag="v$(node -p "require('./package.json').version")"
          if ! git rev-parse -q --verify "refs/tags/$tag" > /dev/null; then
            echo "::error::Tag $tag does not exist; only a released version is published"
            exit 1
          fi
          if ! git diff --quiet "$tag" HEAD -- . ':(exclude).github'; then
            echo "::error::main differs from $tag outside .github/; refusing to publish it as ${tag#v}"
            git diff --stat "$tag" HEAD -- . ':(exclude).github'
            exit 1
          fi

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm check

      - run: pnpm typecheck

      - run: pnpm test:unit

      # `prepack` builds dist/. The publish job skips scripts.
      - run: pnpm pack

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-tarball
          path: zaggino-postgres-mcp-*.tgz
          if-no-files-found: error
          retention-days: 7 # long enough to re-run a failed publish job on its own
          overwrite: true # a re-run of this job replaces the artifact of the earlier attempt

  # Publishes the tarball the build job packed through npm trusted publishing (OIDC). No checkout, no
  # install, no lifecycle scripts.
  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: main
    permissions:
      id-token: write # npm trusted publishing
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          registry-url: https://registry.npmjs.org

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-tarball
          path: npm-tarball

      - name: Publish the tarball
        run: |
          set -- ./npm-tarball/zaggino-postgres-mcp-*.tgz
          if [ "$#" -ne 1 ] || [ ! -f "$1" ]; then
            echo "::error::expected exactly one postgres-mcp tarball in the artifact, found: $*"
            exit 1
          fi
          npm publish "$1" --ignore-scripts --access public
